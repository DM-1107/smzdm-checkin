name: Ctrip Daily Check-in

on:
  schedule:
    - cron: "40 22 * * *"   # 北京 06:40（脚本内再随机 0~10 分钟）
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ctrip-checkin
  cancel-in-progress: false

jobs:
  ctrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Run ctrip check-in
        env:
          CTRIP_TICKET: ${{ secrets.CTRIP_TICKET }}
          CTRIP_UID: ${{ secrets.CTRIP_UID }}
        run: python ctrip_checkin.py
