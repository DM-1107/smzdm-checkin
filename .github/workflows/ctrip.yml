name: Ctrip Daily Check-in

on:
  # 携程会员签到活动已关闭（signToday 持续返回 404002 未满足当前活动参与条件），
  # 已停用定时触发，避免每天发失败邮件。活动若恢复，取消下面注释即可。
  # schedule:
  #   - cron: "40 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ctrip-checkin
  cancel-in-progress: false

jobs:
  ctrip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Run ctrip check-in
        env:
          CTRIP_TICKET: ${{ secrets.CTRIP_TICKET }}
          CTRIP_UID: ${{ secrets.CTRIP_UID }}
        run: python ctrip_checkin.py
      - name: Commit ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gains.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "ledger: ctrip $(date -u +%F)"
          git push || true
